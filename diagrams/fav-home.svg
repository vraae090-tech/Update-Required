<!-- ============================================================
     Lifted straight out of the book: page 27 of City Collection.
     These are the same curves as the printed page, not a trace
     and not a screenshot. One thing was changed and one only:
     every colour became currentColor, so the drawing takes its
     colour from the CSS and comes out white on the chapter
     colour. There is no background here on purpose — the
     section colour is meant to show through.
     Made by pdfwork/extract_diagram.py

     ============================================================
     THIS FILE IS ONE THIRD OF favorites.svg, AND THE LETTERING
     THAT USED TO SIT BESIDE IT IS GONE.

     What it was before: favorites.svg was a single tall drawing
     holding all three circles - the house, the briefcase, and the
     plus - with the words HOME, Add, WORK and Add drawn INTO the
     artwork as outlined letterforms beside two of them. They were
     not text elements. They were paths, the same kind of path as
     the house and the briefcase, so they could not be read by a
     screen reader, could not reflow, could not be translated, and
     could not be set in the caption face the rest of this site
     uses. They came out whatever size the drawing happened to be
     scaled to, which on a narrow screen was smaller than any
     other label on the page.

     Why it changed: a name under a picture is a caption, and this
     site already has one way of doing captions. Every other
     drawing on these four chapters is named by a <figcaption> in
     the page, in the caption face, at the caption size, black on
     white or white on the chapter colour as the mode decides. The
     three circles had been the one exception, naming themselves
     from the inside. So the lettering was dropped and the naming
     handed back to the HTML, which is where the other hundred-odd
     captions on this site already live.

     Also gone: the invisible clipping rectangle the extractor
     left at the top of favorites.svg. It was filled with "none"
     and drew nothing. It only existed to crop a page-sized
     canvas, and this file's viewBox does that job now.

     The circle is untouched. Its centre in the book's own
     coordinates is 470.6, 150.32 and its radius is 78.29, so a
     164-unit box centred on it leaves 3.7 units of air all round
     - enough that the stroke does not graze the edge, tight
     enough that three of these sit at the same weight in a row.
     That is the whole of the arithmetic: the wrapper translate
     below is the centre minus 82.
     ============================================================ -->
