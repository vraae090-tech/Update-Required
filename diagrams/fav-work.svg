<!-- ============================================================
     Lifted straight out of the book: page 27 of City Collection.
     These are the same curves as the printed page, not a trace
     and not a screenshot. One thing was changed and one only:
     every colour became currentColor, so the drawing takes its
     colour from the CSS and comes out white on the chapter
     colour. There is no background here on purpose — the
     section colour is meant to show through.
     Made by pdfwork/extract_diagram.py

     ============================================================
     THIS FILE IS ONE THIRD OF favorites.svg. See fav-home.svg
     for the full account of why the lettering came off and the
     naming went back to the HTML - the short version is that a
     name under a picture is a caption, and WORK was drawn into
     the artwork as outlined letterforms rather than set as a
     caption like every other label on this site.

     The briefcase circle sits to the RIGHT of the other two on
     the printed page, which is why its centre is further along
     the x axis than theirs: 594.72, 297.66, radius 78.29. The
     page put the three in a triangle. The icon-plate in the
     chapter puts them in a row, because a row is what a strip of
     captioned icons wants to be and because the plate is already
     the component doing that job in two other runs. Nothing in
     the drawing changed to allow it - only the box around it.
     Wrapper translate is the centre minus 82, same as the others.
     ============================================================ -->
