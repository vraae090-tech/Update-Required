<!-- ============================================================
     Lifted straight out of the book: page 27 of City Collection.
     These are the same curves as the printed page, not a trace
     and not a screenshot. One thing was changed and one only:
     every colour became currentColor, so the drawing takes its
     colour from the CSS and comes out white on the chapter
     colour. There is no background here on purpose — the
     section colour is meant to show through.
     Made by pdfwork/extract_diagram.py

     ============================================================
     THIS FILE IS ONE THIRD OF favorites.svg. See fav-home.svg
     for the full account of why the lettering came off.

     This is the one circle that never had a word of its own. The
     book letters HOME under the house and WORK under the
     briefcase, and under each of those it also letters a small
     "Add" - but the plus circle itself stands unlabelled, because
     on the page it is obviously the add button and the two Adds
     above it have already said so.

     On screen that does not hold. The three icons are now three
     separate figures in a plate, each one named by its own
     caption, and a plate with two captions and a gap would read
     as a mistake rather than as an argument. So this one is
     captioned "Add" in the chapter - which is not an invention,
     it is the book's own word for it, lifted from the lettering
     that sat under the other two and that this change removed.
     The alternative was to leave the word drawn inside the
     artwork for two circles and absent for the third, which is
     exactly the inconsistency being fixed.

     Centre 470.6, 450.24, radius 78.29. Same circle as the house
     and the briefcase, 300 units further down the printed page.
     Wrapper translate is the centre minus 82.
     ============================================================ -->
